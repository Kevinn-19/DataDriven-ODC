<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS de prueba · SCORM 1.2</title>
<style>
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #111827; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 12px; color: #D1FAE5; font-size: 12px; }
  .bar b { color: #fff; }
  .bar span { white-space: nowrap; }
  .bar button { margin-left: auto; background: #374151; color: #fff; border: 1px solid #4B5563; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .bar button:hover { background: #4B5563; }
  iframe { width: 100%; height: calc(100vh - 34px); border: 0; display: block; background: #fff; }
</style>
<script>
  /*
   * Simula la API SCORM 1.2 que Moodle le entrega al paquete.
   * Los datos se guardan en localStorage para que, al recargar, el curso "continúe donde lo dejó"
   * igual que en Moodle. El botón "Reiniciar intento" los borra.
   */
  var KEY = 'lms-prueba-cmi';
  var cmi;
  try { cmi = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { cmi = null; }
  if (!cmi) cmi = { 'cmi.core.lesson_status': 'not attempted', 'cmi.interactions._count': '0' };
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(cmi)); } catch (e) {} refreshBar(); }

  window.API = {
    LMSInitialize: function () { return 'true'; },
    LMSGetValue: function (k) { return cmi[k] || ''; },
    LMSSetValue: function (k, v) {
      v = String(v);
      if (k === 'cmi.suspend_data' && v.length > 4096) return 'false';
      var m = k.match(/^cmi\.interactions\.(\d+)\.id$/);
      if (m) cmi['cmi.interactions._count'] = String(Math.max(+cmi['cmi.interactions._count'], +m[1] + 1));
      cmi[k] = v;
      return 'true';
    },
    LMSCommit: function () { persist(); return 'true'; },
    LMSFinish: function () { persist(); return 'true'; },
    LMSGetLastError: function () { return '0'; },
    LMSGetErrorString: function () { return ''; },
    LMSGetDiagnostic: function () { return ''; }
  };

  function refreshBar() {
    var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v || '—'; };
    var loc = cmi['cmi.core.lesson_location'];
    set('st', cmi['cmi.core.lesson_status']);
    set('sc', cmi['cmi.core.score.raw']);
    set('lo', loc ? 'pantalla ' + (parseInt(loc, 10) + 1) : '');
    set('it', cmi['cmi.interactions._count']);
    set('sd', (cmi['cmi.suspend_data'] || '').length + ' / 4096');
  }
  function resetAttempt() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  }
  function dump() {
    console.table(cmi);
    alert('Los datos SCORM completos se imprimieron en la consola (F12).');
  }
</script>
</head>
<body>
  <div class="bar">
    <span><b>LMS de prueba</b> (SCORM 1.2)</span>
    <span>Estado: <b id="st">—</b></span>
    <span>Nota: <b id="sc">—</b></span>
    <span>Ubicación: <b id="lo">—</b></span>
    <span>Interacciones: <b id="it">—</b></span>
    <span>suspend_data: <b id="sd">—</b></span>
    <button onclick="dump()">Ver datos</button>
    <button onclick="resetAttempt()" style="margin-left:0">Reiniciar intento</button>
  </div>
  <iframe src="scorm/index.html" title="Curso"></iframe>
  <script>refreshBar();</script>
</body>
</html>
